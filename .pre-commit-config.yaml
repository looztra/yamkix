---
# Kept only as the hook source for `prek`, driven by hk.pkl (hooks without an hk builtin).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml # Validates YAML files
        args: [--allow-multiple-documents]
        exclude: |
          (?x)^(
              tests/data/.*
          )$
      - id: check-toml # Validates TOML files
      - id: check-json # Validates JSON files # .vscode/ json files are actually jsonc files
        exclude: ^.vscode/.*

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/looztra/yamkix
    rev: v1.2.0
    hooks:
      - id: yamkix
        args: [--no-quotes-preserved, --silent]
        exclude: |
          (?x)^(
              tests/data/.*|
              tests/integration/test_cli_subprocess/.*
          )$
