[tools]
actionlint = "1.7"
"github:editorconfig-checker/editorconfig-checker" = "4.0.2"
hk = "2"
"npm:markdownlint-cli2" = "0.24"
prek = "0.5"
"pypi:yamllint" = "1.38"
shellcheck = "0.11"
shfmt = "3"
taplo = "0.10"
uv = "0.13.5"
zizmor = "1.31.1"

[settings]
idiomatic_version_file_enable_tools = [
]

[task_config]
includes = [
    "toolbox/mise/tasks/toml/*.toml",
    "toolbox/scripts",
]
